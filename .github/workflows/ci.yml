name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck · Test · Build · Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # No committed lockfile (gitignored), so use install rather than ci
        # — matches docs.yml / release.yml.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The parity runner drives Chromium via Playwright to render the vendored
      # Bootstrap 5.3.8 oracle and diff it against the styled components.
      - name: Install Playwright browser (parity oracle)
        run: npx playwright install --with-deps chromium

      - name: Parity (visual-regression gate)
        run: npm run parity

      # Keep the rendered/diff PNGs so a parity failure can be inspected.
      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: parity/results/
          if-no-files-found: ignore
